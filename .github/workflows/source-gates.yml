name: Source Gates

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Keep source-policy feedback independent from the build workflow. Pull
  # requests share a group so a newer commit supersedes an obsolete run;
  # pushes use their unique run ID so every main commit remains verified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runtime_src: ${{ steps.filter.outputs.runtime_src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            runtime_src:
              - 'src/**'
              - 'examples/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # A workflow-only change would otherwise skip every job here,
              # including the one being changed - so CI edits would ship
              # unexercised.
              - '.github/workflows/**'

  format:
    # Formatting only. Clippy is its own job below: it compiles the crate,
    # so it needs the build cache and could never be a fast gate the way
    # this one is. rustfmt needs neither, so this reports a formatting slip
    # in well under a minute.
    #
    # Not wired into the other jobs via `needs`. That would serialise this in
    # front of every run to save compute on a rare failure - and the pre-commit
    # hook already catches formatting locally, so the CI failures this catches
    # are mostly fork contributors who do not have the hook.
    name: Format
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # rustfmt only; nothing waits on it.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
          components: rustfmt
      - name: Formatting check
        run: cargo fmt --check

  clippy:
    # Separated from rust_checks so a clippy failure is not buried behind
    # coverage/leak-probe, and so it does not need the postgres/mysql
    # services that back rust_checks's driver coverage. Deliberately NOT
    # wired via `needs` into any other job (matches format's existing
    # "don't serialize the common case" rationale): the pre-commit hook
    # already catches clippy locally, and gating other jobs behind this to
    # save time only on the rare failure path is the wrong trade for the
    # common case.
    name: Clippy
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Compiles the crate, so it is not a fast gate the way format is.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Cache Cargo registry and build artifacts
        # Clippy, Rust Checks and Valgrind previously shared one key
        # (runner.os-cargo-hashFiles) with target/ in the path, while building
        # three different profiles: clippy runs --all-targets --all-features,
        # Rust Checks runs instrumented under llvm-cov, and Valgrind runs
        # plain. actions/cache only lets the first writer save under a given
        # key, so which of the three profiles ended up in the cache depended on
        # which job finished first, and the other two restored artifacts they
        # could not use.
        #
        # rust-cache keys per job automatically (job id + rustc version +
        # Cargo.lock), so the three no longer collide, and it prunes
        # intermediate artifacts before saving so three caches stay smaller
        # than the one they replace.
        #
        # save-if restricts writes to main: three jobs each saving target/ on
        # every PR run would churn the 10GB per-repo cache limit and evict the
        # entries this exists to provide. PRs restore from main, which is the
        # state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  cargo_deny:
    name: Cargo deny
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check dependency policy
        run: cargo deny check advisories licenses sources bans
