name: Benchmarks
# The criterion hot-path suite. It used to run on every push and pull request
# while gating nothing (continue-on-error), spending ~4 minutes per run on a
# report nobody read. It now runs where the cost buys something:
#
#   - on demand, when someone is actually investigating performance;
#   - on release tags, giving a per-version series anchored to something people
#     can correlate with.
#
# Deliberately NOT nightly: a nightly nobody reads is the same noise with a
# schedule attached.
#
# Stays on GitHub-hosted runners. Nobody waits on this, so it is exactly the
# workload that should never consume metered minutes.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  # Keyed on ref so a tag run and a manual run never cancel each other. Never
  # cancel in progress: a partial benchmark run is worse than a slow one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmarks:
    name: Hot-path benchmark suite
    runs-on: ubuntu-latest
    # Runaway guard, well under GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Cache Cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run benchmarks
        run: |
          set -o pipefail
          cargo bench --bench hot_paths 2>&1 | tee bench.log
      - name: Summarize per-group medians
        if: ${{ always() }}
        run: python3 scripts/bench-summary.py target/criterion -o bench-summary.json || true
      - name: Derive a filesystem-safe artifact suffix
        id: label
        # upload-artifact rejects names containing path separators and several
        # other characters. Branch names here are slash-delimited (ci/...,
        # docs/...), so a manual dispatch would otherwise run the whole suite and
        # only then fail on the upload.
        run: printf 'suffix=%s\n' "${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}" >> "$GITHUB_OUTPUT"
      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-benchmark-report-${{ steps.label.outputs.suffix }}
          path: |
            target/criterion/
            bench.log
            bench-summary.json
          if-no-files-found: warn
