name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runtime_src: ${{ steps.filter.outputs.runtime_src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            runtime_src:
              - 'src/**'
              - 'examples/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # A workflow-only change would otherwise skip every job here,
              # including the one being changed - so CI edits would ship
              # unexercised.
              - '.github/workflows/**'

  lint_workflows:
    # actionlint plus its built-in shellcheck integration (active once
    # shellcheck is on PATH, which it is on this image) - context #29's
    # lint-the-pipeline-itself ask. Ungated: a workflow-only change is exactly
    # what this exists to catch, and it is cheap enough not to need a filter.
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint + shellcheck
        run: ./scripts/ci/lint-workflows.sh

  format:
    # Formatting only. Clippy is its own job below: it compiles the crate,
    # so it needs the build cache and could never be a fast gate the way
    # this one is. rustfmt needs neither, so this reports a formatting slip
    # in well under a minute.
    #
    # Not wired into the other jobs via `needs`. That would serialise this in
    # front of every run to save compute on a rare failure - and the pre-commit
    # hook already catches formatting locally, so the CI failures this catches
    # are mostly fork contributors who do not have the hook.
    name: Format
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # rustfmt only; nothing waits on it.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
          components: rustfmt
      - name: Formatting check
        run: cargo fmt --check

  clippy:
    # Separated from rust_checks so a clippy failure is not buried behind
    # coverage/leak-probe, and so it does not need the postgres/mysql
    # services that back rust_checks's driver coverage. Deliberately NOT
    # wired via `needs` into any other job (matches format's existing
    # "don't serialize the common case" rationale): the pre-commit hook
    # already catches clippy locally, and gating other jobs behind this to
    # save time only on the rare failure path is the wrong trade for the
    # common case.
    name: Clippy
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Compiles the crate, so it is not a fast gate the way format is.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Cache Cargo registry and build artifacts
        # Clippy, Rust Checks and Valgrind previously shared one key
        # (runner.os-cargo-hashFiles) with target/ in the path, while building
        # three different profiles: clippy runs --all-targets --all-features,
        # Rust Checks runs instrumented under llvm-cov, and Valgrind runs
        # plain. actions/cache only lets the first writer save under a given
        # key, so which of the three profiles ended up in the cache depended on
        # which job finished first, and the other two restored artifacts they
        # could not use.
        #
        # rust-cache keys per job automatically (job id + rustc version +
        # Cargo.lock), so the three no longer collide, and it prunes
        # intermediate artifacts before saving so three caches stay smaller
        # than the one they replace.
        #
        # save-if restricts writes to main: three jobs each saving target/ on
        # every PR run would churn the 10GB per-repo cache limit and evict the
        # entries this exists to provide. PRs restore from main, which is the
        # state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  ab_benchmark_gate:
    # Roc-style A/B regression gate (plan.md step 5): runs the PR head's
    # `cargo bench` against a cached baseline built from the PR's base
    # commit, using criterion's own --baseline comparison (not hyperfine -
    # hot_paths.rs benchmarks run in the ns-to-low-us range, well below
    # hyperfine's process-spawn floor). Flags a change that clears BOTH a
    # relative and an absolute threshold, confirmed by a second run.
    # See scripts/ci/ab-bench-gate.py for the full algorithm.
    #
    # Reports, does not gate. The verdict is surfaced in the sticky PR comment
    # (see scripts/ci/post-report-comment.sh) and the job stays green either
    # way; it is not a required status check.
    #
    # PR-only: it needs github.event.pull_request.base.sha, which does not
    # exist on a push event. Parallel to detect-changes (not behind
    # rust_checks/clippy) to keep this off the slow path.
    name: A/B Benchmark Report
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.runtime_src == 'true' }}
    # First job on Blacksmith, deliberately this one. At 4.2-8.0m measured it
    # is by a wide margin the slowest job here (Rust Checks, the next longest,
    # is ~3.6m), so it alone bounds PR wall clock and it is the only place a
    # faster runner shortens feedback.
    #
    # It stays a job of its own and must never be folded into a bundle: it is a
    # benchmark, and sharing a machine with valgrind or a coverage build turns
    # its measurements into contention noise.
    #
    # The steadier-hardware question matters more here than in mux-compiler.
    # This gate's threshold was widened from 4% to 15% because four benchmarks
    # showed regressions up to +10% with no source change, and it is now a
    # required check, so noise blocks merges. If dedicated hardware narrows the
    # spread, that threshold should come back down - watch the reported
    # percentages on the first few runs before assuming 15% is still needed.
    #
    # 4vCPU for the two `cargo bench` builds, which parallelise. Criterion's
    # measurement loop is single-threaded and indifferent to core count.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    # Unchanged at 20m. Metered now, so a hang costs real allowance: 20m at the
    # 4vCPU rate is 40 x64-2vCPU-equivalent minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      # Build cache, safe now that the baseline lives outside target/. It used
      # to be cached AT target/criterion/*/*/main, which is why this job could
      # not use rust-cache: rust-cache prunes and saves target/, so the two
      # would have fought over the same directory and a stale restore could
      # have left the comparison running against the wrong baseline.
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Exact-SHA key with no restore-keys fallback, deliberately: a hit on an
      # older base commit would silently compare against the wrong baseline
      # with nothing to signal it. Stores only criterion's main/ estimate
      # directories, and stores them OUTSIDE target/ so the build cache above
      # can own target/ without interfering.
      #
      # ab_baseline_seed (below) writes this same key on every push to main, so
      # a PR based on an up-to-date main normally hits and skips the baseline
      # build entirely - one `cargo bench` per PR instead of two.
      - name: Restore baseline criterion data
        id: baseline_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ab-baseline
          key: mux-runtime-ab-baseline-${{ github.event.pull_request.base.sha }}
      - name: Checkout baseline commit
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline-src
      - name: Build baseline benchmarks
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        working-directory: baseline-src
        run: cargo bench --bench hot_paths -- --save-baseline main
      - name: Stage baseline estimates
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: ./scripts/ci/ab-baseline.sh stage baseline-src/target/criterion ab-baseline
      - name: Load the baseline into this checkout
        run: ./scripts/ci/ab-baseline.sh load ab-baseline target/criterion
      - name: Run PR-head benchmarks against the baseline
        run: cargo bench --bench hot_paths -- --baseline main
      - name: Run A/B benchmark report
        # continue-on-error: this reports, it does not gate. The threshold here
        # was already widened from 4% to 15% because of measurement noise on
        # shared runners, and it still produces false regressions - three
        # unrelated benchmarks moving together by ~19% on a YAML-only change is
        # machine drift, not code. The verdict reaches the reviewer through the
        # PR comment instead of blocking a merge.
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/ci/ab-bench-gate.py 2>&1 | tee ab-bench.log
      - name: Upload the A/B report for the PR comment
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment-ab-bench
          path: ab-bench.log
          if-no-files-found: warn

  ab_baseline_seed:
    # Builds the A/B baseline for main and stores it under the same cache key a
    # PR will look for, so the PR path normally hits and runs `cargo bench`
    # once instead of twice.
    #
    # Before this, the exact-SHA key meant the FIRST pull request after every
    # merge paid a full baseline build - checkout the base, compile the crate
    # cold, benchmark it - and only later PRs on that same base got the cache.
    # Doing it here moves that cost off the PR path entirely.
    #
    # Push-only. It writes a cache keyed by github.sha, which on a push to main
    # is exactly the base.sha a PR opened against it will ask for.
    name: Seed A/B Baseline
    # Every push to main, not just runtime_src ones. A docs-only push still
    # advances main and so becomes some PR's base.sha; skipping it would leave
    # that key unseeded and hand the first PR based on it exactly the baseline
    # build this job exists to remove. Re-benchmarking unchanged source is
    # cheap next to that.
    if: ${{ github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore baseline criterion data
        id: baseline_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ab-baseline
          key: mux-runtime-ab-baseline-${{ github.sha }}
      - name: Build baseline benchmarks
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: cargo bench --bench hot_paths -- --save-baseline main
      - name: Stage baseline estimates
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: ./scripts/ci/ab-baseline.sh stage target/criterion ab-baseline

  rust_checks:
    name: Rust Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Instrumented llvm-cov run plus the rc-leak probe.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    timeout-minutes: 30
    permissions:
      contents: read
    # Postgres + MySQL back the sql driver coverage; the gated driver tests are
    # skipped when their *_URL env vars are unset, so this is the only job that
    # exercises them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mux
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: muxdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mux -d muxdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: muxdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -ppass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      MUX_TEST_POSTGRES_URL: postgres://mux:pass@localhost:5432/muxdb
      MUX_TEST_MYSQL_URL: mysql://root:pass@localhost:3306/muxdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
          components: rustfmt, llvm-tools-preview
      - name: Cache Cargo registry and build artifacts
        # Clippy, Rust Checks and Valgrind previously shared one key
        # (runner.os-cargo-hashFiles) with target/ in the path, while building
        # three different profiles: clippy runs --all-targets --all-features,
        # Rust Checks runs instrumented under llvm-cov, and Valgrind runs
        # plain. actions/cache only lets the first writer save under a given
        # key, so which of the three profiles ended up in the cache depended on
        # which job finished first, and the other two restored artifacts they
        # could not use.
        #
        # rust-cache keys per job automatically (job id + rustc version +
        # Cargo.lock), so the three no longer collide, and it prunes
        # intermediate artifacts before saving so three caches stay smaller
        # than the one they replace.
        #
        # save-if restricts writes to main: three jobs each saving target/ on
        # every PR run would churn the 10GB per-repo cache limit and evict the
        # entries this exists to provide. PRs restore from main, which is the
        # state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked
      - name: Tests with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      # Companion to the compiler's RC Leak Check leg (muxlang/mux-compiler#295),
      # for runtime code itself (issue #22, part 1). The Valgrind job ignores
      # still-reachable, so a never-released refcounted allocation - reachable by
      # definition - slips past it. The rc-leak-check feature's atexit handler
      # counts live RC blocks exactly and exits 101 if any survive. A plain test
      # cannot arm it (the handler is cfg(not(test))), so run a tiny probe both
      # ways: a released block exits 0, a leaked one must exit 101.
      - name: RC leak-check probe (control and leak)
        run: ./scripts/ci/rc-leak-probe.sh
  downstream_compiler_smoke:
    name: Downstream Compiler Smoke Test
    # Verifies that muxlang/mux-compiler still builds and links against THIS
    # branch's runtime source. Catches breaking FFI/symbol changes in the
    # runtime PR that introduces them, instead of after merge/publish.
    #
    # Checks out compiler `main` by default. A coupled change is one runtime PR
    # and one compiler PR (muxlang/mux-context ADR 0003, 0004), so for those
    # `main` is expected to fail until the compiler side lands - it has neither
    # the new FFI nor the updated snapshots. A `paired-compiler:<branch>` label
    # points this job at that branch instead, so the pair is verified together.
    #
    # `paired-examples:<branch>` does the same for the example corpus. A change
    # that alters what example SOURCE must say - not just what it links against -
    # spans three repos, and pinning only the compiler leaves this job compiling
    # old example source with a new compiler.
    #
    # The label is `paired-compiler:<branch>` for a coupled compiler/runtime
    # change. The labels are opt-in and every ordinary runtime PR ignores them: breaking
    # compiler `main` is a real failure and should stay one. Reach for them only
    # when the compiler PR genuinely carries the other half of this change -
    # both have to merge, so the accommodation is reviewable rather than hidden.
    #
    # Apply the label before the run you want it to affect. `pull_request` here
    # fires on opened/synchronize/reopened, so labelling does not start a run,
    # and re-running an existing one replays the original event payload - which
    # still has no label. Push a commit or reopen the PR to pick it up. The
    # `labeled` trigger is deliberately absent: it would rerun the whole
    # workflow on every label change of any kind.
    #
    # Depend on rust_checks so this only runs once the runtime is known to
    # compile cleanly in isolation, keeping failure attribution clear.
    needs: [detect-changes, rust_checks]
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Builds mux-compiler from source against this branch, so it is the
    # longest of these and the most sensitive to a slow toolchain.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # Mirrors muxlang/mux-compiler's .github/workflows/build.yml toolchain env
      # so the runtime is built and linked the same way the compiler CI does it.
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
      # Force the archive built from THIS PR's source below. The compiler no
      # longer reads MUX_RUNTIME_SRC and never builds a runtime while compiling
      # a program (muxlang/mux-context ADR 0004), so without this it would link
      # the runtime its own Cargo.lock pins and this job would silently stop
      # testing the runtime under review.
      MUX_RUNTIME_LIB: ${{ github.workspace }}/target/debug/libmux_runtime.a
    steps:
      - name: Check out runtime (this PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the mux-compiler ref to build against
        id: compiler_ref
        env:
          # Read through env rather than interpolated into the script: a label
          # is attacker-controlled on a fork PR, and `${{ }}` inside `run:` is
          # substituted before the shell sees it. On a push there is no pull
          # request, so this is the string "null" and the default stands.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          ref=main
          paired=$(python3 -c '
            import json
            import os

            labels = json.loads(os.environ.get("PR_LABELS", "[]"))
            match = next(
                (label for label in labels if label.startswith("paired-compiler:")),
                "",
            )
            print(match.removeprefix("paired-compiler:"), end="")
          ')
          if [ -n "$paired" ]; then
            # A branch name may contain '/', so this bounds the character set
            # rather than forbidding paths. The repository below is hardcoded,
            # so only a branch in muxlang/mux-compiler is ever reachable.
            case "$paired" in
              -* | *..* | *[!A-Za-z0-9._/-]*)
                echo "::error::paired-compiler label is not a valid branch name: $paired"
                exit 1
                ;;
            esac
            ref="$paired"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building muxlang/mux-compiler@$ref against this PR's runtime."
      - name: Check out mux-compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: muxlang/mux-compiler
          ref: ${{ steps.compiler_ref.outputs.ref }}
          path: mux-compiler
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Install LLVM 22
        run: ./scripts/ci/install-llvm.sh
      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The runtime archive itself is rebuilt from this checkout every run
          # (below) rather than restored, since exercising THIS branch's source
          # is the whole point of the job.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            mux-compiler/target
          key: ${{ runner.os }}-downstream-cargo-${{ hashFiles('mux-compiler/Cargo.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-downstream-cargo-
      - name: Build this PR's runtime archive
        # Compiled Mux programs link libmux_runtime.a, and cargo emits a
        # dependency's rlib but never its staticlib - so the archive has to be
        # built here explicitly, from this checkout.
        run: |
          set -euo pipefail
          cargo build --locked
          test -f "$MUX_RUNTIME_LIB"

      - name: Compiler executable integration tests against runtime source
        # These tests compile and link .mux programs end to end, so an
        # undefined-symbol / FFI-signature break in the runtime fails here.
        working-directory: mux-compiler
        run: cargo test -p mux-lang --test executable_integration

      # The published examples, against this PR's runtime.
      #
      # This repo has no release workflow - merging to main is what makes a
      # change available (see AGENTS.md) - so a PR is the last point at which a
      # runtime change that breaks a published example can be caught before
      # users get it. The executable tests above cover linking and FFI; these
      # cover OUTPUT, which is where a behaviour change shows up. Both of the
      # JSON fixes in #54 would have altered example output while linking
      # perfectly.
      - name: Resolve the mux-examples ref to run
        id: examples_ref
        env:
          # Same reasoning as the compiler ref above: read the labels through
          # env, because a label is attacker-controlled on a fork PR.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          ref=main
          paired=$(python3 -c '
            import json
            import os

            labels = json.loads(os.environ.get("PR_LABELS", "[]"))
            match = next(
                (label for label in labels if label.startswith("paired-examples:")),
                "",
            )
            print(match.removeprefix("paired-examples:"), end="")
          ')
          if [ -n "$paired" ]; then
            case "$paired" in
              -* | *..* | *[!A-Za-z0-9._/-]*)
                echo "::error::paired-examples label is not a valid branch name: $paired"
                exit 1
                ;;
            esac
            ref="$paired"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Running muxlang/mux-examples@$ref against this PR's runtime."
      - name: Check out mux-examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: muxlang/mux-examples
          ref: ${{ steps.examples_ref.outputs.ref }}
          path: mux-examples

      - name: Build the compiler binary
        # The test step above builds `mux` incidentally, as a dependency of a
        # test that runs it through CARGO_BIN_EXE_mux. Relying on that would
        # make this step break silently if that test is ever changed, so ask
        # for the binary directly. Cached, so it costs nothing here.
        working-directory: mux-compiler
        run: cargo build -p mux-lang --locked

      - name: Run the published examples against this PR's runtime
        working-directory: mux-examples
        env:
          # The compiler built above, linked against MUX_RUNTIME_LIB, which the
          # job already points at this checkout's archive.
          MUX_BIN: ${{ github.workspace }}/mux-compiler/target/debug/mux
        run: ./scripts/run-examples.sh

  valgrind:
    name: Valgrind Memory Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Runs compiled programs, which hang rather than crash under
    # LLVM UB - the reason every such run is wrapped in `timeout`.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    timeout-minutes: 30
    permissions:
      contents: read
    # Runs the runtime's own cargo test binaries under Memcheck. Same failure
    # policy as the compiler's Leg A (muxlang/mux-compiler#246): definitely-lost
    # and indirectly-lost leaks and memory errors fail; still-reachable and
    # possibly-lost are ignored. The SQL/net driver tests that need external
    # services stay skipped here (their *_URL env vars are unset), so this job
    # exercises the pure-Rust runtime surface deterministically.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Cache Cargo registry and build artifacts
        # Clippy, Rust Checks and Valgrind previously shared one key
        # (runner.os-cargo-hashFiles) with target/ in the path, while building
        # three different profiles: clippy runs --all-targets --all-features,
        # Rust Checks runs instrumented under llvm-cov, and Valgrind runs
        # plain. actions/cache only lets the first writer save under a given
        # key, so which of the three profiles ended up in the cache depended on
        # which job finished first, and the other two restored artifacts they
        # could not use.
        #
        # rust-cache keys per job automatically (job id + rustc version +
        # Cargo.lock), so the three no longer collide, and it prunes
        # intermediate artifacts before saving so three caches stay smaller
        # than the one they replace.
        #
        # save-if restricts writes to main: three jobs each saving target/ on
        # every PR run would churn the 10GB per-repo cache limit and evict the
        # entries this exists to provide. PRs restore from main, which is the
        # state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests under Valgrind
        id: run
        # Manual Valgrind (not cargo-valgrind): it keeps the exact same flags and
        # leak policy as the compiler CI, needs no extra crate pinned in the
        # toolchain, and makes each test binary's report explicit in the log.
        run: ./scripts/ci/valgrind-tests.sh
      - name: Upload valgrind log for PR comment
        # Raw log only; the trusted pr-comment workflow escapes and renders it.
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment-valgrind
          path: valgrind.log
          if-no-files-found: warn

  sonarqube:
    name: SonarQube
    needs: rust_checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone for better analysis relevancy
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage-lcov
      - name: Normalize coverage paths
        # cargo-llvm-cov writes absolute SF paths; make them relative to the repo
        # root so the SonarQube Rust LCOV importer can match them to indexed files.
        run: '[ -f lcov.info ] && sed -i "s#${{ github.workspace }}/##g" lcov.info || true'
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan above waits for analysis (sonar.qualitygate.wait), so the
      # new-issue count is queryable by the time this runs.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/ci/sonar-new-issues.sh muxlang_mux-runtime "${{ github.event.pull_request.number }}"
