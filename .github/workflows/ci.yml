name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    # Source Gates owns the required "Detect Changed Paths" context. This
    # classifier is private to the build graph and feeds its job-level guards.
    name: Detect Build Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runtime_src: ${{ steps.filter.outputs.runtime_src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/runtime-source-paths.yml

  rust_checks:
    name: Rust Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Instrumented llvm-cov run plus the rc-leak probe.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    timeout-minutes: 30
    permissions:
      contents: read
    # Postgres + MySQL back the sql driver coverage; the gated driver tests are
    # skipped when their *_URL env vars are unset, so this is the only job that
    # exercises them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mux
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: muxdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mux -d muxdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: muxdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -ppass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      MUX_TEST_POSTGRES_URL: postgres://mux:pass@localhost:5432/muxdb
      MUX_TEST_MYSQL_URL: mysql://root:pass@localhost:3306/muxdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          # Rust branch instrumentation is still an unstable coverage
          # option. Keep the coverage compiler separate from the stable
          # toolchain used by the source gates, and pin it so profile data is
          # reproducible across runs.
          toolchain: nightly-2026-08-01
          components: rustfmt, llvm-tools-preview
      - name: Cache Cargo registry and build artifacts
        # Clippy, Rust Checks and Valgrind previously shared one key
        # (runner.os-cargo-hashFiles) with target/ in the path, while building
        # three different profiles: clippy runs --all-targets --all-features,
        # Rust Checks runs instrumented under llvm-cov, and Valgrind runs
        # plain. actions/cache only lets the first writer save under a given
        # key, so which of the three profiles ended up in the cache depended on
        # which job finished first, and the other two restored artifacts they
        # could not use.
        #
        # rust-cache keys per job automatically (job id + rustc version +
        # Cargo.lock), so the three no longer collide, and it prunes
        # intermediate artifacts before saving so three caches stay smaller
        # than the one they replace.
        #
        # save-if restricts writes to main: three jobs each saving target/ on
        # every PR run would churn the 10GB per-repo cache limit and evict the
        # entries this exists to provide. PRs restore from main, which is the
        # state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.7 --force
      - name: Tests with coverage
        id: coverage
        run: |
          set -euo pipefail
          # The merged workspace profile has unstable per-function mappings
          # across multiple test targets. Skip only that non-contractual
          # metric; line and branch coverage remain exported and gated below.
          cargo +nightly-2026-08-01 llvm-cov --all-features --workspace --branch --skip-functions --lcov --output-path lcov.info 2>&1 | tee coverage.log
          test -s lcov.info
          grep -q '^BRF:' lcov.info
          grep -q '^BRH:' lcov.info
          ! grep -q 'functions have mismatched data' coverage.log
      - name: Enforce branch coverage floor
        run: ./scripts/ci/check-branch-coverage.sh lcov.info 50
      - name: Upload coverage report
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      # Companion to the compiler's RC Leak Check leg (muxlang/mux-compiler#295),
      # for runtime code itself (issue #22, part 1). The Valgrind job ignores
      # still-reachable, so a never-released refcounted allocation - reachable by
      # definition - slips past it. The rc-leak-check feature's atexit handler
      # counts live RC blocks exactly and exits 101 if any survive. A plain test
      # cannot arm it (the handler is cfg(not(test))), so run a tiny probe both
      # ways: a released block exits 0, a leaked one must exit 101.
      - name: RC leak-check probe (control and leak)
        run: ./scripts/ci/rc-leak-probe.sh
  downstream_compiler_smoke:
    name: Downstream Compiler Smoke Test
    # Verifies that muxlang/mux-compiler still builds and links against THIS
    # branch's runtime source. Catches breaking FFI/symbol changes in the
    # runtime PR that introduces them, instead of after merge/publish.
    #
    # Checks out compiler `main` by default. A coupled change is one runtime PR
    # and one compiler PR (muxlang/mux-context ADR 0003, 0004), so for those
    # `main` is expected to fail until the compiler side lands - it has neither
    # the new FFI nor the updated snapshots. A `paired-compiler:<branch>` label
    # points this job at that branch instead, so the pair is verified together.
    #
    # `paired-examples:<branch>` does the same for the example corpus. A change
    # that alters what example SOURCE must say - not just what it links against -
    # spans three repos, and pinning only the compiler leaves this job compiling
    # old example source with a new compiler.
    #
    # The label is `paired-compiler:<branch>` for a coupled compiler/runtime
    # change. The labels are opt-in and every ordinary runtime PR ignores them: breaking
    # compiler `main` is a real failure and should stay one. Reach for them only
    # when the compiler PR genuinely carries the other half of this change -
    # both have to merge, so the accommodation is reviewable rather than hidden.
    #
    # Apply the label before the run you want it to affect. `pull_request` here
    # fires on opened/synchronize/reopened, so labelling does not start a run,
    # and re-running an existing one replays the original event payload - which
    # still has no label. Push a commit or reopen the PR to pick it up. The
    # `labeled` trigger is deliberately absent: it would rerun the whole
    # workflow on every label change of any kind.
    #
    # Depend on rust_checks so this only runs once the runtime is known to
    # compile cleanly in isolation, keeping failure attribution clear.
    needs: [detect-changes, rust_checks]
    if: ${{ needs.detect-changes.outputs.runtime_src == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Builds mux-compiler from source against this branch, so it is the
    # longest of these and the most sensitive to a slow toolchain.
    # 2vCPU: these run in parallel, so wall clock is set by the slowest
    # of them, and paying double the rate for the others is wasted.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # Mirrors muxlang/mux-compiler's .github/workflows/build.yml toolchain env
      # so the runtime is built and linked the same way the compiler CI does it.
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
      # Force the archive built from THIS PR's source below. The compiler no
      # longer reads MUX_RUNTIME_SRC and never builds a runtime while compiling
      # a program (muxlang/mux-context ADR 0004), so without this it would link
      # the runtime its own Cargo.lock pins and this job would silently stop
      # testing the runtime under review.
      MUX_RUNTIME_LIB: ${{ github.workspace }}/target/debug/libmux_runtime.a
    steps:
      - name: Check out runtime (this PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the mux-compiler ref to build against
        id: compiler_ref
        env:
          # Read through env rather than interpolated into the script: a label
          # is attacker-controlled on a fork PR, and `${{ }}` inside `run:` is
          # substituted before the shell sees it. On a push there is no pull
          # request, so this is the string "null" and the default stands.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          ref=main
          paired=$(python3 -c 'import json, os; labels = json.loads(os.environ.get("PR_LABELS", "[]")); match = next((label for label in labels if label.startswith("paired-compiler:")), ""); print(match.removeprefix("paired-compiler:"), end="")')
          if [ -n "$paired" ]; then
            # A branch name may contain '/', so this bounds the character set
            # rather than forbidding paths. The repository below is hardcoded,
            # so only a branch in muxlang/mux-compiler is ever reachable.
            case "$paired" in
              -* | *..* | *[!A-Za-z0-9._/-]*)
                echo "::error::paired-compiler label is not a valid branch name: $paired"
                exit 1
                ;;
            esac
            ref="$paired"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building muxlang/mux-compiler@$ref against this PR's runtime."
      - name: Check out mux-compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: muxlang/mux-compiler
          ref: ${{ steps.compiler_ref.outputs.ref }}
          path: mux-compiler
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Install LLVM 22
        run: ./scripts/ci/install-llvm.sh
      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The runtime archive itself is rebuilt from this checkout every run
          # (below) rather than restored, since exercising THIS branch's source
          # is the whole point of the job.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            mux-compiler/target
          key: ${{ runner.os }}-downstream-cargo-${{ hashFiles('mux-compiler/Cargo.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-downstream-cargo-
      - name: Build this PR's runtime archive
        # Compiled Mux programs link libmux_runtime.a, and cargo emits a
        # dependency's rlib but never its staticlib - so the archive has to be
        # built here explicitly, from this checkout.
        run: |
          set -euo pipefail
          cargo build --locked
          test -f "$MUX_RUNTIME_LIB"

      - name: Compiler executable integration tests against runtime source
        # These tests compile and link .mux programs end to end, so an
        # undefined-symbol / FFI-signature break in the runtime fails here.
        working-directory: mux-compiler
        run: cargo test -p mux-lang --test executable_integration

      # The published examples, against this PR's runtime.
      #
      # This repo has no release workflow - merging to main is what makes a
      # change available (see AGENTS.md) - so a PR is the last point at which a
      # runtime change that breaks a published example can be caught before
      # users get it. The executable tests above cover linking and FFI; these
      # cover OUTPUT, which is where a behaviour change shows up. Both of the
      # JSON fixes in #54 would have altered example output while linking
      # perfectly.
      - name: Resolve the mux-examples ref to run
        id: examples_ref
        env:
          # Same reasoning as the compiler ref above: read the labels through
          # env, because a label is attacker-controlled on a fork PR.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          ref=main
          paired=$(python3 -c 'import json, os; labels = json.loads(os.environ.get("PR_LABELS", "[]")); match = next((label for label in labels if label.startswith("paired-examples:")), ""); print(match.removeprefix("paired-examples:"), end="")')
          if [ -n "$paired" ]; then
            case "$paired" in
              -* | *..* | *[!A-Za-z0-9._/-]*)
                echo "::error::paired-examples label is not a valid branch name: $paired"
                exit 1
                ;;
            esac
            ref="$paired"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Running muxlang/mux-examples@$ref against this PR's runtime."
      - name: Check out mux-examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: muxlang/mux-examples
          ref: ${{ steps.examples_ref.outputs.ref }}
          path: mux-examples

      - name: Build the compiler binary
        # The test step above builds `mux` incidentally, as a dependency of a
        # test that runs it through CARGO_BIN_EXE_mux. Relying on that would
        # make this step break silently if that test is ever changed, so ask
        # for the binary directly. Cached, so it costs nothing here.
        working-directory: mux-compiler
        run: cargo build -p mux-lang --locked

      - name: Run the published examples against this PR's runtime
        working-directory: mux-examples
        env:
          # The compiler built above, linked against MUX_RUNTIME_LIB, which the
          # job already points at this checkout's archive.
          MUX_BIN: ${{ github.workspace }}/mux-compiler/target/debug/mux
        run: ./scripts/run-examples.sh

  sonarqube:
    name: SonarQube
    needs: rust_checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone for better analysis relevancy
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage-lcov
      - name: Normalize coverage paths
        # cargo-llvm-cov writes absolute SF paths; make them relative to the repo
        # root so the SonarQube Rust LCOV importer can match them to indexed files.
        run: '[ -f lcov.info ] && sed -i "s#${{ github.workspace }}/##g" lcov.info || true'
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan above waits for analysis (sonar.qualitygate.wait), so the
      # new-issue count is queryable by the time this runs.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/ci/sonar-new-issues.sh muxlang_mux-runtime "${{ github.event.pull_request.number }}"
