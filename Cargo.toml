[package]
name = "mux-runtime"
version = "0.6.0"
edition = "2021"
description = "Runtime library for the Mux programming language"
authors = ["Derek Corniello"]
repository = "https://github.com/muxlang/mux-runtime"
license = "MIT"
keywords = ["mux", "runtime", "language"]
categories = ["development-tools", "compilers"]

[lib]
name = "mux_runtime"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["full"]
core = []
# `preserve_order` makes serde_json parse objects into an insertion-ordered map
# rather than a sorted one. Without it the key order is gone before our own
# conversion ever runs, so `Json::Object` could not preserve what it never saw.
json = ["dep:serde_json", "serde_json/preserve_order", "dep:indexmap"]
csv = ["dep:csv"]
net = ["json", "dep:ureq", "dep:httparse"]
sql = ["dep:rusqlite", "dep:postgres", "dep:mysql"]
sync = []
full = ["core", "json", "csv", "net", "sql", "sync"]
# Debug/CI-only: track live reference-counted Value blocks and abort a compiled
# program at exit if any survive teardown, catching leaked module globals
# (mux-compiler#284) exactly rather than via Valgrind's still-reachable heuristic.
# Deliberately NOT part of `full`/`default`, so release builds pay nothing and
# the compiler's full-feature parity test is unaffected. Enable it only for the
# runtime linked into the compiler's leak-check CI leg.
rc-leak-check = []

[dependencies]
ordered-float = "4.0"
hashbrown = "0.15"
lazy_static = "1.4"
libc = "0.2"
paste = "1.0"
chrono = "0.4"
serde_json = { version = "1.0", optional = true }
indexmap = { version = "2", optional = true }
csv = { version = "1", optional = true }
ureq = { version = "2.10", optional = true }
httparse = { version = "1.10", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
postgres = { version = "0.19", optional = true }
mysql = { version = "28", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Kernel", "Win32_System_Threading"] }

[dev-dependencies]
ordered-float = "4.0"
libc = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }

# Local/manual + non-blocking-CI benchmarks for the runtime hot paths. Not a gate.
[[bench]]
name = "hot_paths"
harness = false
